<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="app-title">
                    <div class="app-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="app-name">AI Assistant</span>
                </div>
                <button class="mobile-close" id="mobileSidebarClose">
                    <span class="material-icons">close</span>
                </button>
            </div>
            
            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn">
                    <span class="material-icons">add</span>
                    <span>New chat</span>
                </button>
                
                <div class="chat-history" id="chatHistory">
                    <!-- Chat history items will be populated here -->
                </div>
                
                <div class="sidebar-bottom">
                    <button class="sidebar-btn" id="settingsBtn">
                        <span class="material-icons">settings</span>
                        <span>Settings</span>
                    </button>
                    
                    <button class="sidebar-btn" id="shareBtn">
                        <span class="material-icons">share</span>
                        <span>Share chat</span>
                    </button>
                    
                    <button class="sidebar-btn" id="resumeBtn">
                        <span class="material-icons">download</span>
                        <span>Load chat</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="main-content">
            <!-- Mobile Header -->
            <div class="mobile-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span class="material-icons">menu</span>
                </button>
                <div class="mobile-title">AI Assistant</div>
                <div class="mobile-actions">
                    <button class="mobile-action-btn" id="mobileSettingsBtn">
                        <span class="material-icons">settings</span>
                    </button>
                </div>
            </div>
            
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be dynamically added here -->
                </div>
                
                <!-- Chat Input -->
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <div class="input-field">
                            <textarea id="chatInput" class="chat-input" placeholder="Message AI Assistant..." rows="1" autocomplete="off"></textarea>
                            <div class="input-actions">
                                <button id="micBtn" class="input-btn mic-btn" title="Voice input">
                                    <span class="material-icons" id="micIcon">mic</span>
                                </button>
                                <button id="sendBtn" class="input-btn send-btn" disabled>
                                    <span class="material-icons">send</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="modal-close">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="modelSelect">Model</label>
                    <select id="modelSelect" class="setting-select">
                        <option value="">Loading models...</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label for="agentSelect">Agent</label>
                    <select id="agentSelect" class="setting-select">
                        <option value="">Select an agent (optional)</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="streamToggle" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">Stream responses</span>
                    </label>
                </div>
                
                <div class="setting-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="voiceToggle" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">Voice interaction</span>
                    </label>
                </div>
                
                <div class="setting-group">
                    <div class="privacy-notice">
                        <p>Conversations are processed to provide responses and may be used to improve the service.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Share Dialog -->
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Share chat</h3>
                <button class="modal-close" id="closeShareModal">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="url-container">
                    <input type="text" id="shareUrl" class="url-input" readonly>
                    <button id="copyUrlBtn" class="copy-btn">
                        <span class="material-icons">content_copy</span>
                    </button>
                </div>
                <p class="url-info">Anyone with this URL can view your conversation</p>
            </div>
        </div>
    </div>

    <!-- Load Chat Dialog -->
    <div class="modal" id="loadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Load conversation</h3>
                <button class="modal-close">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="threadIdInput">Thread ID</label>
                    <input type="text" id="threadIdInput" class="text-input" placeholder="Enter thread ID...">
                </div>
                <button id="loadChatBtn" class="primary-btn">
                    <span class="material-icons">download</span>
                    <span>Load conversation</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        window.THREAD_ID = '{{ thread_id }}';
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
